
// reading_create.html – create reading
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Avaliação – Leitura</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <a href="index.html">← Voltar</a>
    <h1>Adicionar Avaliação – Leitura</h1>
  </header>
  <main>
    <form id="readingForm">
      <label for="nome">Nome do Livro:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="autor">Autor(a):</label>
      <input type="text" id="autor" name="autor" required>

      <label for="editora">Editora/Publicadora:</label>
      <input type="text" id="editora" name="editora" required>

      <label for="ano_leitura">Ano de Leitura:</label>
      <input type="number" id="ano_leitura" name="ano_leitura" required>

      <label for="historia">História (0‑10):</label>
      <input type="number" id="historia" name="historia" min="0" max="10" required>

      <label for="personagens">Personagens (0‑10):</label>
      <input type="number" id="personagens" name="personagens" min="0" max="10" required>

      <label for="ritmo">Ritmo (0‑10):</label>
      <input type="number" id="ritmo" name="ritmo" min="0" max="10" required>

      <label for="enredo">Enredo (0‑10):</label>
      <input type="number" id="enredo" name="enredo" min="0" max="10" required>

      <label for="obs">Observações:</label>
      <textarea id="obs" name="obs" rows="4" cols="50"></textarea>

      <button type="submit">Enviar</button>
    </form>
  </main>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    import { addReadingReview } from './assets/js/app.js';
    const form = document.getElementById('readingForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const reading = {};
      for (const [key, value] of formData.entries()) {
        reading[key] = value;
      }
      
      try {
        await addReadingReview(reading);
        alert('Avaliação enviada!');
        form.reset();
      } catch (err) {
        console.error(err);
        alert('Erro ao enviar: ' + err.message);
      }
    });
  </script>
</body>
</html>

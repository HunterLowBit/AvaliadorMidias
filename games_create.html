<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Avaliação – Jogos</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <header>
    <a href="index.html">← Voltar</a>
    <h1>Adicionar Avaliação – Jogos</h1>
  </header>
  <main>
    <form id="reviewForm">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="ano">Ano:</label>
      <input type="number" id="ano" name="ano" required>

      <label for="idioma">Idioma:</label>
      <input type="text" id="idioma" name="idioma" required>

      <label for="jogabilidade">Jogabilidade:</label>
      <input type="number" id="jogabilidade" name="jogabilidade" min="0" max="10" required>

      <label for="apresentacao">Apresentação:</label>
      <input type="number" id="apresentacao" name="apresentacao" min="0" max="10" required>

      <label for="grafico">Gráfico:</label>
      <input type="number" id="grafico" name="grafico" min="0" max="10" required>

      <label for="som">Som:</label>
      <input type="number" id="som" name="som" min="0" max="10" required>

      <label for="ambiente">Ambiente:</label>
      <input type="number" id="ambiente" name="ambiente" min="0" max="10" required>

      <label for="designers">Designers:</label>
      <input type="number" id="designers" name="designers" min="0" max="10" required>

      <label for="roteiro">Roteiro:</label>
      <input type="number" id="roteiro" name="roteiro" min="0" max="10" required>

      <label for="historia">História:</label>
      <input type="number" id="historia" name="historia" min="0" max="10" required>

      <label for="personagens">Personagens:</label>
      <input type="number" id="personagens" name="personagens" min="0" max="10" required>

      <label for="vozes">Vozes:</label>
      <input type="number" id="vozes" name="vozes" min="0" max="10" required>

      <label for="obs">Observações:</label>
      <textarea id="obs" name="obs" rows="4" cols="50"></textarea>

      <button type="submit">Enviar</button>
    </form>
  </main>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    import { addGameReview } from './assets/js/app.js';
    const form = document.getElementById('reviewForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const review = {};
      for (const [key, value] of formData.entries()) {
        review[key] = value;
      }

      try {
        await addGameReview(review);
        alert('Avaliação enviada!');
        form.reset();
      } catch (err) {
        console.error(err);
        alert('Erro ao enviar: ' + err.message);
      }
    });
  </script>
</body>

</html>

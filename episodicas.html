<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episódicas - Avaliações</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <header>
    <a href="index.html">← Voltar</a>
    <h1>Episódicas (Animes, Séries, Desenhos)</h1>
    <a href="episodicas_create.html" class="button">Criar Avaliação</a>
  </header>
  <main id="content">
    <p>Carregando avaliações de episódios...</p>
  </main>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    import { fetchEpisodicas } from './assets/js/app.js';
    const content = document.getElementById('content');
    async function load() {
      try {
        const series = await fetchEpisodicas();
        content.innerHTML = '';
        if (series.length === 0) {
          content.innerHTML = '<p>Nenhuma avaliação encontrada.</p>';
          return;
        }
        const ul = document.createElement('ul');
        series.forEach(s => {
          const li = document.createElement('li');
          li.innerHTML = `<strong>${s.nome}</strong> (${s.ano}) - ${s.media}★<br>${s.obs}`;
          ul.appendChild(li);
        });
        content.appendChild(ul);
      } catch (e) {
        content.innerHTML = `<p>Erro ao carregar avaliações: ${e.message}</p>`;
      }
    }
    load();
  </script>
</body>

</html>
